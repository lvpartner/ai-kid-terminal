[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-kid-terminal"
version = "0.3.0"
description = "Server for a child-safe Android AI voice terminal"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite==0.21.0",
  "alembic==1.16.4",
  "asyncpg==0.30.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "prometheus-client==0.22.1",
  "pypdf==6.14.2",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "qrcode==8.2",
  "sqlalchemy[asyncio]==2.0.41",
  "typer==0.16.0",
  "uvicorn[standard]==0.35.0",
  "websockets==15.0.1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.4",
]

[project.scripts]
kid-terminal = "kid_terminal.cli:app"
kid-simulator = "kid_terminal.simulator:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kid_terminal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
ignore_missing_imports = true
