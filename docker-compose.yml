services:
  db:
    image: postgres:17.5-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: kid_terminal
      POSTGRES_USER: kid_terminal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make setup}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kid_terminal -d kid_terminal"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kid_terminal:${POSTGRES_PASSWORD}@db:5432/kid_terminal
      HOST: 0.0.0.0
      RELEASE_DIR: /app/releases
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - release_data:/app/releases
      - backup_data:/app/backups
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges=true]
    cap_drop: [ALL]
    networks: [backend, edge]

  caddy:
    image: caddy:2.11.4-alpine
    profiles: [public]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./downloads:/srv/bootstrap:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges=true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [edge]

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres_data:
  release_data:
  backup_data:
  caddy_data:
  caddy_config:
